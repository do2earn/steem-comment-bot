name: Deploy Steem Comment Bot API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "wrangler.toml"
      - ".github/workflows/deploy-worker.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Wrangler
        run: npm install --global wrangler
      - name: Create or find D1 database and configure binding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID repository secret."
            exit 1
          fi
          RESPONSE="$(curl -fsS             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?name=steem-comment-bot-sessions")"
          DB_ID="$(printf '%s' "$RESPONSE" | jq -r '.result[0].uuid // empty')"
          if [ -z "$DB_ID" ]; then
            CREATE_RESPONSE="$(curl -fsS -X POST               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"               -H "Content-Type: application/json"               --data '{"name":"steem-comment-bot-sessions"}'               "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database")"
            DB_ID="$(printf '%s' "$CREATE_RESPONSE" | jq -r '.result.uuid // empty')"
          fi
          if [ -z "$DB_ID" ]; then
            echo "Could not find or create D1 database. Check Cloudflare token permissions."
            exit 1
          fi
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$DB_ID/" wrangler.toml
          echo "D1 database binding configured."
      - name: Apply D1 migrations
        run: wrangler d1 migrations apply steem-comment-bot-sessions --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Configure Posting Key as Worker Secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STEEM_POSTING_KEY: ${{ secrets.STEEM_POSTING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${STEEM_POSTING_KEY:-}" ]; then
            echo "Missing STEEM_POSTING_KEY repository secret."
            exit 1
          fi
          printf '%s' "$STEEM_POSTING_KEY" | wrangler secret put STEEM_POSTING_KEY
      - name: Deploy Worker
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
