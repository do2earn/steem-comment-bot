name: Steem Comment Bot — Manual Publish (Safe Default)

on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: "Enable publishing (leave unchecked for dry-run)"
        required: true
        type: boolean
        default: false
      confirm_account:
        description: 'Type exactly @do2earn to confirm publishing'
        required: false
        type: string
        default: ""
      max_comments:
        description: "Maximum comments for this run"
        required: true
        type: choice
        options:
          - "1"
          - "3"
          - "5"
          - "10"
        default: "3"

permissions:
  contents: read

concurrency:
  group: steem-comment-bot-manual-publish
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund

      - name: Run dry-run or explicitly confirmed publishing
        run: node src/publish.js
        env:
          CONFIRM_PUBLISH: ${{ inputs.confirm_publish }}
          CONFIRM_ACCOUNT: ${{ inputs.confirm_account }}
          MAX_COMMENTS: ${{ inputs.max_comments }}
          # The key is passed only when BOTH explicit confirmations are present.
          STEEM_POSTING_KEY: ${{ inputs.confirm_publish && inputs.confirm_account == '@do2earn' && secrets.STEEM_POSTING_KEY || '' }}
